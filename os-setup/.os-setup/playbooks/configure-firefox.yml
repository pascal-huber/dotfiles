# AI generated
- name: Configure firefox and librewolf
  hosts: localhost
  become: true
  vars:
    browser_targets:
      - name: Firefox
        policies_dir: /etc/firefox/policies
      - name: LibreWolf
        policies_dir: /etc/librewolf/policies
    browser_certs:
      - name: root_ca.crt
        src: files/root_ca.crt
      - name: intermediate_ca.crt
        src: files/intermediate_ca.crt
  tasks:
    - name: Ensure policies directory exists
      ansible.builtin.file:
        path: "{{ item.policies_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ browser_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ensure certificates directory exists
      ansible.builtin.file:
        path: "{{ item.policies_dir }}/certificates"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ browser_targets }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Deploy CA certificates
      ansible.builtin.copy:
        src: "{{ item.1.src }}"
        dest: "{{ item.0.policies_dir }}/certificates/{{ item.1.name }}"
        owner: root
        group: root
        mode: "0644"
      loop: "{{ browser_targets | product(browser_certs) | list }}"
      loop_control:
        label: "{{ item.0.name }} / {{ item.1.name }}"

    - name: Deploy policies.json
      ansible.builtin.copy:
        dest: "{{ item.policies_dir }}/policies.json"
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "policies": {
              "Certificates": {
                "Install": [
                  "{{ item.policies_dir }}/certificates/root_ca.crt",
                  "{{ item.policies_dir }}/certificates/intermediate_ca.crt"
                ]
              },
              "Preferences": {
                "toolkit.legacyUserProfileCustomizations.stylesheets": {
                  "Value": true,
                  "Status": "default"
                },
                "sidebar.revamp": {
                  "Value": false,
                  "Status": "default"
                },
                "browser.toolbars.bookmarks.visibility": {
                  "Value": "never",
                  "Status": "locked"
                },
                "privacy.donottrackheader.enabled": {
                  "Value": true,
                  "Status": "default"
                },
                "webgl.disabled": {
                  "Value": false,
                  "Status": "locked"
                },
                "librewolf.webgl.prompt": {
                  "Value": true,
                  "Status": "default"
                },
                "librewolf.webgl.prompt.hide": {
                  "Value": false,
                  "Status": "default"
                },
                "webgl.force-enabled": {
                  "Value": true,
                  "Status": "default"
                },
                "privacy.fingerprintingProtection": {
                  "Value": true,
                  "Status": "default"
                },
                "privacy.fingerprintingProtection.overrides": {
                  "Value": "+AllTargets,-JSDateTimeUTC",
                  "Status": "default"
                }
              },
              "Cookies": {
                "Behavior": "reject-tracker-and-partition-foreign",
                "BehaviorPrivateBrowsing": "reject-tracker-and-partition-foreign",
                "Locked": false
              },
              "EnableTrackingProtection": {
                "Value": true,
                "Locked": false,
                "Category": "strict",
                "Cryptomining": true,
                "Fingerprinting": true,
                "EmailTracking": true
              },
              "SanitizeOnShutdown": {
                "Cookies": true,
                "Cache": false,
                "History": false,
                "Downloads": false,
                "FormData": false,
                "Sessions": false,
                "SiteSettings": false,
                "Locked": false
              },
              "ExtensionSettings": {
                "uBlock0@raymondhill.net": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/ublock-origin/latest.xpi"
                },
                "floccus@handmadeideas.org": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/floccus/latest.xpi"
                },
                "gdpr@cavi.au.dk": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/consent-o-matic/latest.xpi"
                },
                "{c9f848fb-3fb6-4390-9fc1-e4dd4d1c5122}": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/adsum-notabs/latest.xpi"
                },
                "CanvasBlocker@kkapsner.de": {
                  "installation_mode": "force_installed",
                  "install_url": "https://addons.mozilla.org/firefox/downloads/latest/canvasblocker/latest.xpi"
                },
                "*": {
                  "installation_mode": "allowed"
                }
              }
            }
          }
      loop: "{{ browser_targets }}"
      loop_control:
        label: "{{ item.name }}"
      register: policies_files

    - name: Notify if policies.json changed and browser needs restarting
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: policies.json changed — restart {{ item.item.name }} on this host to apply the new policies."
      loop: "{{ policies_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.changed

