# PipeWire 7.1 -> stereo downmix with adjustable center/dialogue level.
#
# 7.1 input channel layout:
#
#   FL  = Front Left
#   FR  = Front Right
#   FC  = Front Center
#         Usually contains most dialogue in movies/TV.
#   LFE = Low Frequency Effects / subwoofer
#   RL  = Rear Left
#   RR  = Rear Right
#   SL  = Side Left
#   SR  = Side Right
#
# Input order:
#
#   FL FR FC LFE RL RR SL SR
#
# This config starts with fairly "normal" downmix values:
#
#   Left  = 1.00*FL + 0.707*FC + 0.00*LFE + 0.50*RL + 0.50*SL
#   Right = 1.00*FR + 0.707*FC + 0.00*LFE + 0.50*RR + 0.50*SR
#
# Important:
#
#   "Gain 2" is the center/dialogue level.
#
# Normal center value:
#
#   0.707 = about -3 dB
#
# Dialogue boost examples:
#
#   0.707 = normal/reference
#   0.80  = slight dialogue boost
#   0.90  = moderate dialogue boost
#   1.00  = strong dialogue boost
#   1.20  = very strong dialogue boost, may clip
#
# If it distorts, lower other gains or use a limiter in EasyEffects.

context.modules = [
{   name = libpipewire-module-filter-chain
    args = {
        node.description = "Center Adjustable Downmix 7.1 to Stereo"
        media.name       = "Center Adjustable Downmix 7.1 to Stereo"

        filter.graph = {
            nodes = [
                {
                    # Copies FC/front-center so it can go to both L and R.
                    type  = builtin
                    name  = fc_copy
                    label = copy
                }

                {
                    # Copies LFE/subwoofer so it can go to both L and R.
                    # It is muted by default with Gain 3 = 0.00.
                    type  = builtin
                    name  = lfe_copy
                    label = copy
                }

                {
                    # Left stereo mixer.
                    #
                    # Inputs:
                    #
                    #   In 1 = FL, front left
                    #   In 2 = FC, front center/dialogue
                    #   In 3 = LFE, subwoofer
                    #   In 4 = RL, rear left
                    #   In 5 = SL, side left
                    #
                    # Formula:
                    #
                    #   Left = Gain1*FL + Gain2*FC + Gain3*LFE + Gain4*RL + Gain5*SL
                    type  = builtin
                    name  = mix_l
                    label = mixer

                    control = {
                        # Gain 1: FL -> Left.
                        #
                        # FL = Front Left.
                        # 1.00 means normal front-left level.
                        "Gain 1" = 1.00

                        # Gain 2: FC -> Left.
                        #
                        # FC = Front Center.
                        # This is usually dialogue/voices.
                        #
                        # 0.707 is the normal/reference downmix value.
                        #
                        # Increase this to make dialogue louder.
                        # Suggested fine adjustments:
                        #
                        #   0.707 = normal
                        #   0.80  = small boost
                        #   0.90  = medium boost
                        #   1.00  = strong boost
                        #   1.10  = stronger
                        #   1.20  = very strong, may clip
                        "Gain 2" = 1.00

                        # Gain 3: LFE -> Left.
                        #
                        # LFE = Low Frequency Effects/subwoofer.
                        # 0.00 means muted, which is common for stereo/headphone downmix.
                        #
                        # If you want some sub-bass effects, try:
                        #
                        #   0.10
                        #   0.20
                        #
                        # Be careful: LFE can add mud or clipping.
                        "Gain 3" = 0.00

                        # Gain 4: RL -> Left.
                        #
                        # RL = Rear Left.
                        # 0.50 keeps rear ambience/effects but reduced.
                        #
                        # Lower this if rear effects distract from dialogue.
                        "Gain 4" = 0.50

                        # Gain 5: SL -> Left.
                        #
                        # SL = Side Left.
                        # 0.50 keeps side ambience/effects but reduced.
                        #
                        # Lower this if side effects distract from dialogue.
                        "Gain 5" = 0.50
                    }
                }

                {
                    # Right stereo mixer.
                    #
                    # Inputs:
                    #
                    #   In 1 = FR, front right
                    #   In 2 = FC, front center/dialogue
                    #   In 3 = LFE, subwoofer
                    #   In 4 = RR, rear right
                    #   In 5 = SR, side right
                    #
                    # Formula:
                    #
                    #   Right = Gain1*FR + Gain2*FC + Gain3*LFE + Gain4*RR + Gain5*SR
                    type  = builtin
                    name  = mix_r
                    label = mixer

                    control = {
                        # Gain 1: FR -> Right.
                        #
                        # FR = Front Right.
                        # 1.00 means normal front-right level.
                        "Gain 1" = 1.00

                        # Gain 2: FC -> Right.
                        #
                        # FC = Front Center/dialogue.
                        #
                        # Keep this the same as the left mixer Gain 2.
                        # If left/right center gains are different, dialogue
                        # will shift away from the center.
                        #
                        # 0.707 is normal/reference.
                        # Raise this for dialogue boost.
                        "Gain 2" = 1.00

                        # Gain 3: LFE -> Right.
                        #
                        # LFE = Low Frequency Effects/subwoofer.
                        # Muted by default.
                        "Gain 3" = 0.00

                        # Gain 4: RR -> Right.
                        #
                        # RR = Rear Right.
                        "Gain 4" = 0.50

                        # Gain 5: SR -> Right.
                        #
                        # SR = Side Right.
                        "Gain 5" = 0.50
                    }
                }
            ]

            links = [
                # FC/front-center/dialogue goes to left mixer input 2.
                { output = "fc_copy:Out"  input = "mix_l:In 2" }

                # FC/front-center/dialogue goes to right mixer input 2.
                # Equal left/right level keeps dialogue centered.
                { output = "fc_copy:Out"  input = "mix_r:In 2" }

                # LFE/subwoofer goes to left mixer input 3.
                # Currently muted by Gain 3 = 0.00.
                { output = "lfe_copy:Out" input = "mix_l:In 3" }

                # LFE/subwoofer goes to right mixer input 3.
                # Currently muted by Gain 3 = 0.00.
                { output = "lfe_copy:Out" input = "mix_r:In 3" }
            ]

            inputs = [
                # Input 1: FL = Front Left.
                "mix_l:In 1"

                # Input 2: FR = Front Right.
                "mix_r:In 1"

                # Input 3: FC = Front Center/dialogue.
                "fc_copy:In"

                # Input 4: LFE = Low Frequency Effects/subwoofer.
                "lfe_copy:In"

                # Input 5: RL = Rear Left.
                "mix_l:In 4"

                # Input 6: RR = Rear Right.
                "mix_r:In 4"

                # Input 7: SL = Side Left.
                "mix_l:In 5"

                # Input 8: SR = Side Right.
                "mix_r:In 5"
            ]

            outputs = [
                # Final stereo left output.
                "mix_l:Out"

                # Final stereo right output.
                "mix_r:Out"
            ]
        }

        capture.props = {
            # Internal node name.
            node.name = "center_adjustable_downmix_7_1"

            # Makes this appear as an output device/sink.
            media.class = Audio/Sink

            # This virtual sink accepts 8-channel/7.1 input.
            audio.channels = 8

            # 7.1 input channel positions.
            audio.position = [ FL FR FC LFE RL RR SL SR ]
        }

        playback.props = {
            # Internal stereo output node name.
            node.name = "center_adjustable_downmix_7_1_out"

            # Passive playback side.
            node.passive = true

            # Stereo output.
            audio.channels = 2
            audio.position = [ FL FR ]
        }
    }
}
]
